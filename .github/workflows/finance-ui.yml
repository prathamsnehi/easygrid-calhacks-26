name: Isolated finance UI integration
on:
  pull_request:
    paths:
      - 'apps/finance-demo/**'
      - 'packages/contracts/src/**'
  push:
    paths:
      - 'apps/finance-demo/**'
      - 'packages/contracts/src/**'
jobs:
  finance-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install contracts dependencies
        run: npm ci --ignore-scripts
        working-directory: packages/contracts
      - name: Test real reducer finance adapter
        run: npm test
        working-directory: apps/finance-demo
