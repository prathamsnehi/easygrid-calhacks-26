name: Service checks

on:
  pull_request:
  push:
    branches:
      - main
      - prath/cal-28-shared-setup

permissions:
  contents: read

jobs:
  services:
    name: Cartesia and SpacetimeDB
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Cartesia dependencies
        run: npm ci --prefix services/cartesia

      - name: Test Cartesia with mocked provider responses
        run: npm test --prefix services/cartesia

      - name: Typecheck Cartesia
        run: npm run typecheck --prefix services/cartesia

      - name: Build Cartesia
        run: npm run build --prefix services/cartesia

      - name: Build shared negotiation contracts
        run: npm ci --ignore-scripts --prefix packages/contracts && npm run build --prefix packages/contracts

      - name: Install SpacetimeDB dependencies
        run: npm ci --prefix services/spacetimedb

      - name: Typecheck SpacetimeDB
        run: npm run typecheck --prefix services/spacetimedb

      - name: Build SpacetimeDB
        run: npm run build --prefix services/spacetimedb

      - name: Verify atomic negotiation state and backend handoff
        run: npm ci --ignore-scripts --prefix services/spacetimedb/module && npm run typecheck --prefix services/spacetimedb/module && npm test --prefix services/spacetimedb/module

      - name: Install Claude review adapter
        run: npm ci --ignore-scripts --prefix services/claude-api

      - name: Verify Claude review with synthetic transcripts
        run: npm run typecheck --prefix services/claude-api && npm test --prefix services/claude-api && npm run build --prefix services/claude-api
