name: Shared API contract
on:
  pull_request:
    paths: ['packages/contracts/**', '.github/workflows/contracts.yml']
  push:
    branches: [main]
    paths: ['packages/contracts/**', '.github/workflows/contracts.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
